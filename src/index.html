<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
</head>

<body>
    <!-- NAVBAR -->
    <nav>
        <h1>Atmospheric App</h1>
        <ul>
            <li>Forecast</li>
            <li>Maps</li>
            <li>Alerts</li>
            <li><a href="https://github.com/IgnacioCastroT/Weather-App" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: none;"><i data-lucide="github" style="width: 16px; height: 16px; display: inline-block; vertical-align: middle; margin-right: 4px;"></i>GitHub</a></li>
        </ul>
        <button>Settings</button>
    </nav>

    <!-- BUSCADOR -->
    <div id="search-wrapper">
        <div id="search-container">
            <svg id="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="search" placeholder="Search for a city...">
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <div id="main-card">
            <div id="main-info">
                <h2 id="city"></h2>
                <p id="datetime"></p>
                <p id="conditions"></p>
                <p id="temp"></p>
            </div>

            <div id="weather-icon"></div>

            <div id="extra-info">
                <p><i data-lucide="wind"></i> Wind: <span id="wind"></span></p>
                <p><i data-lucide="droplets"></i> Humidity: <span id="humidity"></span></p>
                <p><i data-lucide="eye"></i> Visibility: <span id="visibility"></span></p>
            </div>
        </div>
    </main>

    <footer>
        <p>Diseñado y desarrollado por <strong>Ignacio</strong> &copy; 2026</p>
    </footer>

    <script src="https://unpkg.com/lucide@latest"></script>
</body>

</html>
